name: opener-ledger
# Daily, an hour after the 15:05 UTC odds tick, so the day's openers are in the archive.
on:
  schedule:
    - cron: "5 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pandas
      - run: python ledger.py
        env:
          MODEL_REPO_TOKEN: ${{ secrets.MODEL_REPO_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: commit
        run: |
          git config user.name "mbm-data"
          git config user.email "mbm-data@users.noreply.github.com"
          mkdir -p ledger
          git add ledger
          git commit -m "ledger $(date -u +%F)" || echo "nothing new"
          git pull --rebase && git push

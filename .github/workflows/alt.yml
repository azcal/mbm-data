name: alt-spreads-snapshot
# Sunday 16:35 UTC (10:35am MDT), half an hour after the regular NFL snapshot it reads from.
on:
  schedule:
    - cron: "35 16 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  alt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pandas
      - run: python alt_snapshot.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: commit
        run: |
          git config user.name "mbm-data"
          git config user.email "mbm-data@users.noreply.github.com"
          mkdir -p odds
          git add odds
          git commit -m "alt spreads $(date -u +%F)" || echo "nothing new"
          git pull --rebase && git push

name: alt-spreads-snapshot
# Sunday 16:35 UTC (10:35am MDT), half an hour after the regular NFL snapshot it reads from.
on:
  schedule:
    # Hourly tick; slot_gate.py decides whether a tick does work, because GitHub starts
    # scheduled jobs hours late. Slots (UTC): alt=sun@16:35
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# One run at a time. A second tick waits, then its gate sees the first one's marker.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      name: ${{ steps.g.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            slot_gate.py
            .slots/alt.txt
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 slot_gate.py
        env:
          SLOTS: "alt=sun@16:35"
          SLOT_MARKER: ".slots/alt.txt"
          SLOT_EVENT: ${{ github.event_name }}
          SLOT_TZ: "UTC"
          SLOT_WINDOW_H: "1.4"
  alt:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install requests pandas
      - run: python alt_snapshot.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: commit
        run: |
          git config user.name "mbm-data"
          git config user.email "mbm-data@users.noreply.github.com"
          mkdir -p odds
          git add odds
          git commit -m "alt spreads $(date -u +%F)" || echo "nothing new"
          git pull --rebase && git push
      # Last step on purpose: the slot is only marked done when everything above succeeded,
      # so a failed run is retried by the next hourly tick.
      - name: record slot
        if: needs.gate.outputs.slot != 'manual'
        run: |
          mkdir -p .slots && echo "${{ needs.gate.outputs.slot }}" > .slots/alt.txt
          git config user.name mbm-bot
          git config user.email mbm-bot@users.noreply.github.com
          git add .slots/alt.txt
          git commit -q -m "slot alt ${{ needs.gate.outputs.slot }}" || exit 0
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash && git push -q; then exit 0; fi
            sleep $((i * 4))
          done
          echo "could not record the slot; the next tick will run this again"

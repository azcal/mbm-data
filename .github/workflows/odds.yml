name: odds-snapshots
on:
  schedule:
    - cron: "5 11 * * *"     # 11:05 UTC  soccer (Sat, Sun)
    - cron: "5 15 * * *"     # 15:05 UTC  NCAAF (Sat)
    - cron: "5 16 * * *"     # 16:05 UTC  NFL Sunday early window
    - cron: "5 22 * * *"     # 22:05 UTC  NBA, NHL, WNBA, MMA
    - cron: "5 23 * * *"     # 23:05 UTC  NFL Thursday / Monday night
  workflow_dispatch:
    inputs:
      force_sport:
        description: "Snapshot one sport now, e.g. americanfootball_nfl (blank = follow the schedule)"
        default: ""
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python odds_snapshot.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE_SPORT: ${{ inputs.force_sport }}
      - name: commit
        run: |
          git config user.name "mbm-data"
          git config user.email "mbm-data@users.noreply.github.com"
          mkdir -p odds
          git add odds
          git commit -m "odds snapshot $(date -u +%FT%H:%M)" || echo "nothing new"
          git pull --rebase && git push

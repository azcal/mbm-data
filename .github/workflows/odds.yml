name: odds-snapshots
on:
  schedule:
    # Hourly tick; slot_gate.py decides whether a tick does work, because GitHub starts
    # scheduled jobs hours late. Slots (UTC): h11=11:05,h15=15:05,h16=16:05,h22=22:05,h23=23:05
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_sport:
        description: "Snapshot one sport now, e.g. americanfootball_nfl (blank = follow the schedule)"
        default: ""
permissions:
  contents: write
# One run at a time. A second tick waits, then its gate sees the first one's marker.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      name: ${{ steps.g.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            slot_gate.py
            .slots/odds.txt
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 slot_gate.py
        env:
          SLOTS: "h11=11:05,h15=15:05,h16=16:05,h22=22:05,h23=23:05"
          SLOT_MARKER: ".slots/odds.txt"
          SLOT_EVENT: ${{ github.event_name }}
          SLOT_TZ: "UTC"
          SLOT_WINDOW_H: "2"
  snap:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python odds_snapshot.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE_SPORT: ${{ inputs.force_sport }}
          TICK_SLOT: ${{ needs.gate.outputs.slot }}
      - name: commit
        run: |
          git config user.name "mbm-data"
          git config user.email "mbm-data@users.noreply.github.com"
          mkdir -p odds
          git add odds
          git commit -m "odds snapshot $(date -u +%FT%H:%M)" || echo "nothing new"
          git pull --rebase && git push
      # Last step on purpose: the slot is only marked done when everything above succeeded,
      # so a failed run is retried by the next hourly tick.
      - name: record slot
        if: needs.gate.outputs.slot != 'manual'
        run: |
          mkdir -p .slots && echo "${{ needs.gate.outputs.slot }}" > .slots/odds.txt
          git config user.name mbm-bot
          git config user.email mbm-bot@users.noreply.github.com
          git add .slots/odds.txt
          git commit -q -m "slot odds ${{ needs.gate.outputs.slot }}" || exit 0
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash && git push -q; then exit 0; fi
            sleep $((i * 4))
          done
          echo "could not record the slot; the next tick will run this again"

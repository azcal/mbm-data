name: alt-ledger
# Sunday 17:05 UTC (after the alt snapshot) to flag, Tuesday 16:05 UTC to grade.
on:
  schedule:
    # Hourly tick; slot_gate.py decides whether a tick does work, because GitHub starts
    # scheduled jobs hours late. Slots (UTC): flag=sun@17:05,grade=tue@16:05
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
# One run at a time. A second tick waits, then its gate sees the first one's marker.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
      slot: ${{ steps.g.outputs.slot }}
      name: ${{ steps.g.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            slot_gate.py
            .slots/alt_ledger.txt
          sparse-checkout-cone-mode: false
      - id: g
        run: python3 slot_gate.py
        env:
          SLOTS: "flag=sun@17:05,grade=tue@16:05"
          SLOT_MARKER: ".slots/alt_ledger.txt"
          SLOT_EVENT: ${{ github.event_name }}
          SLOT_TZ: "UTC"
  alt_ledger:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install requests pandas
      - run: python alt_ledger.py
        env:
          MODEL_REPO_TOKEN: ${{ secrets.MODEL_REPO_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: commit
        run: |
          git config user.name "mbm-data"
          git config user.email "mbm-data@users.noreply.github.com"
          mkdir -p ledger
          git add ledger
          git commit -m "alt ledger $(date -u +%F)" || echo "nothing new"
          git pull --rebase && git push
      # Last step on purpose: the slot is only marked done when everything above succeeded,
      # so a failed run is retried by the next hourly tick.
      - name: record slot
        if: needs.gate.outputs.slot != 'manual'
        run: |
          mkdir -p .slots && echo "${{ needs.gate.outputs.slot }}" > .slots/alt_ledger.txt
          git config user.name mbm-bot
          git config user.email mbm-bot@users.noreply.github.com
          git add .slots/alt_ledger.txt
          git commit -q -m "slot alt_ledger ${{ needs.gate.outputs.slot }}" || exit 0
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash && git push -q; then exit 0; fi
            sleep $((i * 4))
          done
          echo "could not record the slot; the next tick will run this again"
